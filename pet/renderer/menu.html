<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>鲸鱼娘桌宠 · 控制面板</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff;
    --bg-soft: #f6f7f9;
    --card: #ffffff;
    --line: #e2e5ea;
    --line-strong: #cfd4dc;
    --text: #1f2328;
    --text-dim: #6b7280;
    --accent: #2f6feb;
    --accent-soft: #eaf1ff;
    --green: #1a7f37;
    --green-soft: #e9f7ec;
    --red: #cf222e;
    --red-soft: #fdecee;
  }
  html, body {
    height: 100%;
    background: transparent;
    overflow: hidden;
    font: 12.5px/1.5 system-ui, "Microsoft YaHei", sans-serif;
    color: var(--text);
    -webkit-user-select: none;
  }
  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
    background: var(--bg);
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.18);
  }

  /* ---------------- title bar ---------------- */
  .titlebar {
    -webkit-app-region: drag;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 9px 12px;
    background: var(--bg-soft);
    border-bottom: 1px solid var(--line);
  }
  .titlebar .title { flex: 1; font-weight: 600; font-size: 12.5px; }
  .titlebar .close {
    -webkit-app-region: no-drag;
    width: 22px; height: 22px;
    border: 0; border-radius: 6px;
    background: transparent; color: var(--text-dim);
    font-size: 13px; cursor: pointer; line-height: 1;
  }
  .titlebar .close:hover { background: var(--red-soft); color: var(--red); }

  /* ------------- quick actions (always visible) ------------- */
  .quick {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    padding: 9px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  .quick button {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 7px 4px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    font: inherit;
    font-size: 11.5px;
    cursor: pointer;
    transition: all 0.13s ease;
    white-space: nowrap;
  }
  .quick button .ico { font-size: 15px; line-height: 1; }
  .quick button:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .quick button:active { transform: scale(0.97); }

  /* -------------------- tabs -------------------- */
  .tabs {
    display: flex;
    gap: 6px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-soft);
  }
  .tab {
    flex: 1;
    padding: 6px 10px;
    border: 1px solid transparent;
    border-radius: 7px;
    background: transparent;
    color: var(--text-dim);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.13s ease;
  }
  .tab:hover { background: var(--card); border-color: var(--line); color: var(--text); }
  .tab.active {
    background: var(--card);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }

  /* ------------------- content ------------------- */
  .content { flex: 1; overflow-y: auto; padding: 11px 12px; }
  .content::-webkit-scrollbar { width: 7px; }
  .content::-webkit-scrollbar-thumb { background: #d7dbe2; border-radius: 4px; }
  .content::-webkit-scrollbar-thumb:hover { background: #c2c8d2; }
  .panel { display: none; }
  .panel.active { display: block; }

  .group { margin-bottom: 13px; }
  .group-title {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 6px;
    font-weight: 600;
  }
  /* auto-fit grid: text wraps instead of being cut off */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
    gap: 6px;
  }
  .item {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 32px;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    font: inherit;
    font-size: 11.5px;
    line-height: 1.35;
    text-align: center;
    cursor: pointer;
    /* full text, wrapped to as many lines as needed */
    white-space: normal;
    overflow-wrap: anywhere;
    word-break: break-word;
    transition: all 0.13s ease;
  }
  .item:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .item:active { transform: scale(0.98); }
  /* selected state — the ONLY place a tick is added (never also in the label,
     so a selected item shows exactly one ✓) */
  .item.on {
    border-color: var(--green);
    background: var(--green-soft);
    color: var(--green);
    font-weight: 600;
  }
  .item.on::before { content: "✓"; margin-right: 4px; }

  /* rows (settings) */
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    margin-bottom: 6px;
  }
  .row .label { font-size: 11.5px; }
  .row.click { cursor: pointer; transition: all 0.13s ease; }
  .row.click:hover { border-color: var(--accent); background: var(--accent-soft); }
  .row .value { font-size: 11.5px; color: var(--text-dim); }
  .row.on { border-color: var(--green); background: var(--green-soft); }
  .row.on .value { color: var(--green); font-weight: 600; }

  .inline { display: flex; flex-wrap: wrap; gap: 5px; }
  .inline .item { min-width: 56px; }

  /* ------------------- footer ------------------- */
  .footer {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    background: var(--bg-soft);
    border-top: 1px solid var(--line);
  }
  .status { flex: 1; font-size: 11px; color: var(--text-dim); line-height: 1.45; }
  .status b { color: var(--accent); font-weight: 600; }
  .quit {
    padding: 6px 13px;
    border: 1px solid var(--red);
    border-radius: 7px;
    background: transparent;
    color: var(--red);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .quit:hover { background: var(--red); color: #fff; }
</style>
</head>
<body>
<div class="app">
  <div class="titlebar">
    <span class="title">🐳 鲸鱼娘桌宠</span>
    <button class="close" id="closeBtn" title="关闭面板">✕</button>
  </div>

  <!-- quick actions live right on the panel, no tab of their own -->
  <div class="quick" id="quick"></div>

  <div class="tabs" id="tabs"></div>
  <div class="content" id="content"></div>

  <div class="footer">
    <div class="status" id="status">加载中…</div>
    <button class="quit" id="quitBtn" title="退出桌宠程序">退出程序</button>
  </div>
</div>
<script src="./menu.js"></script>
</body>
</html>
